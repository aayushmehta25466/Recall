name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Sync manifest version
        run: |
          cd dist
          node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
            m.version = '${{ steps.version.outputs.VERSION }}';
            fs.writeFileSync('manifest.json', JSON.stringify(m, null, 2));
          "

      - name: Zip extension
        run: cd dist && zip -r ../bookmarkly-${{ steps.version.outputs.VERSION }}.zip . -x ".*"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.version.outputs.VERSION }}
          body: |
            ## Bookmarkly v${{ steps.version.outputs.VERSION }}

            ### Install
            1. Download `bookmarkly-${{ steps.version.outputs.VERSION }}.zip`
            2. Unzip the file
            3. Open `chrome://extensions/`
            4. Enable **Developer mode**
            5. Click **Load unpacked** → select the unzipped folder
          files: bookmarkly-${{ steps.version.outputs.VERSION }}.zip
          draft: false
          prerelease: false
