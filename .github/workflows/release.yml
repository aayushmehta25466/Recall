name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build

      - name: Get version from tag
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building Bookmarkly version: $VERSION"

      - name: Sync manifest version
        run: |
          node <<'NODE'
          const fs = require('fs');

          const manifestPath = 'dist/manifest.json';
          const version = process.env.VERSION;

          if (!fs.existsSync(manifestPath)) {
            console.error(`Manifest not found: ${manifestPath}`);
            process.exit(1);
          }

          const manifest = JSON.parse(
            fs.readFileSync(manifestPath, 'utf8')
          );

          manifest.version = version;

          fs.writeFileSync(
            manifestPath,
            JSON.stringify(manifest, null, 2) + '\n'
          );

          console.log(`Manifest version updated to ${version}`);
          NODE
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}

      - name: Verify manifest
        run: |
          echo "Final manifest:"
          cat dist/manifest.json

      - name: Create source code zip
        run: |
          zip -r \
            "bookmarkly-${{ steps.version.outputs.VERSION }}-source.zip" \
            . \
            -x "node_modules/*" \
               "dist/*" \
               ".git/*" \
               "bookmarkly-extension.pem" \
               "extension-key.pem" \
               "key.pem" \
               "*.crx"

      # ---------------------------------------------------------
      # Restore permanent signing key
      # ---------------------------------------------------------
      - name: Check CRX signing secret
        env:
          CRX_PRIVATE_KEY_B64: ${{ secrets.CRX_PRIVATE_KEY_B64 }}
        run: |
          if [ -z "$CRX_PRIVATE_KEY_B64" ]; then
            echo "::error::CRX_PRIVATE_KEY_B64 is not available."
            exit 1
          fi

          echo "CRX_PRIVATE_KEY_B64 is available."
          echo "Encoded key length: ${#CRX_PRIVATE_KEY_B64}"

      - name: Restore CRX private key
        env:
          CRX_PRIVATE_KEY_B64: ${{ secrets.CRX_PRIVATE_KEY_B64 }}
        run: |
          printf '%s' "$CRX_PRIVATE_KEY_B64" \
            | base64 --decode \
            > extension-key.pem

          chmod 600 extension-key.pem

          if [ ! -s extension-key.pem ]; then
            echo "::error::Decoded private key is empty."
            exit 1
          fi

          echo "CRX private key restored successfully."

      # ---------------------------------------------------------
      # Verify CRX package tool
      # ---------------------------------------------------------
      - name: Verify CRX package tool
        run: |
          ./node_modules/.bin/crx --help

      # ---------------------------------------------------------
      # Build CRX
      # ---------------------------------------------------------
      - name: Create CRX package
        run: |
          ./node_modules/.bin/crx pack \
            dist/ \
            -p extension-key.pem \
            -o "bookmarkly-${{ steps.version.outputs.VERSION }}.crx"

      - name: Verify CRX package
        run: |
          CRX_FILE="bookmarkly-${{ steps.version.outputs.VERSION }}.crx"

          if [ ! -s "$CRX_FILE" ]; then
            echo "::error::CRX file was not created."
            exit 1
          fi

          echo "CRX created successfully:"
          ls -lh "$CRX_FILE"

      # ---------------------------------------------------------
      # Remove private key
      # ---------------------------------------------------------
      - name: Remove signing key
        if: always()
        run: |
          rm -f extension-key.pem
          echo "Signing key removed from runner."

      # ---------------------------------------------------------
      # Changelog
      # ---------------------------------------------------------
      - name: Get changelog from commits
        id: changelog
        shell: bash
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s" HEAD)
          else
            COMMITS=$(git log --pretty=format:"- %s" "${PREV_TAG}..HEAD")
          fi

          echo "COMMITS<<EOF" >> "$GITHUB_OUTPUT"
          echo "$COMMITS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------
      # GitHub Release
      # ---------------------------------------------------------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "🚀 Bookmarkly v${{ steps.version.outputs.VERSION }}"
          tag_name: "v${{ steps.version.outputs.VERSION }}"

          body: |
            ## What's New

            ${{ steps.changelog.outputs.COMMITS }}

            ---

            ## Downloads

            ### Chrome Extension

            Download:

            `bookmarkly-${{ steps.version.outputs.VERSION }}.crx`

            ### Source Code

            Download:

            `bookmarkly-${{ steps.version.outputs.VERSION }}-source.zip`

            ---

            ## Installation

            ### CRX

            1. Download the `.crx` file.
            2. Open `chrome://extensions/`
            3. Enable Developer mode.
            4. Drag the `.crx` file onto the Extensions page.
            5. Follow Chrome's installation prompt.

            ### Load Unpacked

            1. Download the source ZIP.
            2. Extract it.
            3. Open `chrome://extensions/`
            4. Enable Developer mode.
            5. Click Load unpacked.
            6. Select the `dist` folder.

            ---

            **Version:** `${{ steps.version.outputs.VERSION }}`

          files: |
            bookmarkly-${{ steps.version.outputs.VERSION }}.crx
            bookmarkly-${{ steps.version.outputs.VERSION }}-source.zip

          draft: false
          prerelease: false
