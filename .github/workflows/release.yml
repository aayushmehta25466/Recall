name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # 1. Checkout repository
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Setup Node.js
      # ---------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ---------------------------------------------------------
      # 3. Install dependencies
      # ---------------------------------------------------------
      - name: Install dependencies
        run: npm ci

      # ---------------------------------------------------------
      # 4. Build extension
      # ---------------------------------------------------------
      - name: Build extension
        run: npm run build

      # ---------------------------------------------------------
      # 5. Get version from Git tag
      # ---------------------------------------------------------
      - name: Get version from tag
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"

          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

          echo "Building Recall version: $VERSION"

      # ---------------------------------------------------------
      # 6. Sync manifest version
      # ---------------------------------------------------------
      - name: Sync manifest version
        run: |
          node <<'NODE'
          const fs = require('fs');

          const manifestPath = 'dist/manifest.json';
          const version = process.env.VERSION;

          if (!fs.existsSync(manifestPath)) {
            console.error(`Manifest not found: ${manifestPath}`);
            process.exit(1);
          }

          const manifest = JSON.parse(
            fs.readFileSync(manifestPath, 'utf8')
          );

          manifest.version = version;

          fs.writeFileSync(
            manifestPath,
            JSON.stringify(manifest, null, 2) + '\n'
          );

          console.log(`Manifest version updated to ${version}`);
          NODE
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}

      # ---------------------------------------------------------
      # 7. Verify final extension build
      # ---------------------------------------------------------
      - name: Verify extension build
        run: |
          if [ ! -f "dist/manifest.json" ]; then
            echo "::error::dist/manifest.json does not exist."
            exit 1
          fi

          echo "Final extension contents:"
          find dist -maxdepth 3 -type f | sort

          echo ""
          echo "Manifest:"
          cat dist/manifest.json

      # ---------------------------------------------------------
      # 8. Create final extension ZIP
      #
      # IMPORTANT:
      # This ZIP contains ONLY the built dist/ contents.
      # ---------------------------------------------------------
      - name: Create extension ZIP
        run: |
          cd dist

          zip -r \
            "../recall-${{ steps.version.outputs.VERSION }}-extension.zip" \
            .

      # ---------------------------------------------------------
      # 9. Create source ZIP
      #
      # This contains the actual project source, but excludes
      # generated build files and dependencies.
      # ---------------------------------------------------------
      - name: Create source ZIP
        run: |
          zip -r \
            "recall-${{ steps.version.outputs.VERSION }}-source.zip" \
            . \
            -x "node_modules/*" \
               "dist/*" \
               ".git/*" \
               "*.crx" \
               "*.zip" \
               "*.pem" \
               "*.b64"

      # ---------------------------------------------------------
      # 10. Verify release artifacts
      # ---------------------------------------------------------
      - name: Verify release artifacts
        run: |
          EXTENSION_ZIP="recall-${{ steps.version.outputs.VERSION }}-extension.zip"
          SOURCE_ZIP="recall-${{ steps.version.outputs.VERSION }}-source.zip"

          if [ ! -s "$EXTENSION_ZIP" ]; then
            echo "::error::Extension ZIP was not created."
            exit 1
          fi

          if [ ! -s "$SOURCE_ZIP" ]; then
            echo "::error::Source ZIP was not created."
            exit 1
          fi

          echo "Release artifacts:"
          ls -lh "$EXTENSION_ZIP"
          ls -lh "$SOURCE_ZIP"

      # ---------------------------------------------------------
      # 11. Create GitHub Release
      # ---------------------------------------------------------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "🚀 Recall v${{ steps.version.outputs.VERSION }}"
          tag_name: "v${{ steps.version.outputs.VERSION }}"

          body: |
            ## What's New

            ${{ steps.changelog.outputs.COMMITS }}

            ---

            ## 📦 Downloads

            ### Recall Extension

            Download:

            `recall-${{ steps.version.outputs.VERSION }}-extension.zip`

            This ZIP contains the final production build of Recall.

            ### Source Code

            Download:

            `recall-${{ steps.version.outputs.VERSION }}-source.zip`

            This contains the project source code for developers.

            ---

            ## 🚀 Install Recall

            1. Download the `-extension.zip` file.
            2. Extract the ZIP file.
            3. Open Chrome and go to:
               `chrome://extensions/`
            4. Enable **Developer mode**.
            5. Click **Load unpacked**.
            6. Select the extracted extension folder containing `manifest.json`.

            ---

            **Version:** `${{ steps.version.outputs.VERSION }}`

          files: |
            recall-${{ steps.version.outputs.VERSION }}-extension.zip
            recall-${{ steps.version.outputs.VERSION }}-source.zip

          draft: false
          prerelease: false

      # ---------------------------------------------------------
      # 12. Generate changelog
      # ---------------------------------------------------------
      - name: Get changelog from commits
        id: changelog
        shell: bash
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s" HEAD)
          else
            COMMITS=$(git log --pretty=format:"- %s" "${PREV_TAG}..HEAD")
          fi

          echo "COMMITS<<EOF" >> "$GITHUB_OUTPUT"
          echo "$COMMITS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
