name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Sync manifest version
        run: |
          cd dist
          node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
            m.version = '${{ steps.version.outputs.VERSION }}';
            fs.writeFileSync('manifest.json', JSON.stringify(m, null, 2));
          "

      - name: Create source code zip
        run: zip -r bookmarkly-${{ steps.version.outputs.VERSION }}-source.zip . -x "node_modules/*" "dist/*" ".git/*"

      - name: Generate extension key
        run: |
          openssl genrsa -out extension-key.pem 2048 2>/dev/null

      - name: Create CRX package
        run: |
          npx crx pack dist/ -p extension-key.pem -o bookmarkly-${{ steps.version.outputs.VERSION }}.crx

      - name: Get changelog from commits
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s" HEAD)
          else
            COMMITS=$(git log --pretty=format:"- %s" ${PREV_TAG}..HEAD)
          fi
          echo "COMMITS<<EOF" >> "$GITHUB_OUTPUT"
          echo "$COMMITS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "🚀 Bookmarkly v${{ steps.version.outputs.VERSION }}"
          tag_name: v${{ steps.version.outputs.VERSION }}
          body: |
            ## What's New

            ${{ steps.changelog.outputs.COMMITS }}

            ---

            ## Install

            ### Option 1: Direct Install (CRX)
            1. Download `bookmarkly-${{ steps.version.outputs.VERSION }}.crx` below
            2. Open `chrome://extensions/`
            3. Enable **Developer mode** (top-right toggle)
            4. Drag and drop the `.crx` file onto the extensions page
            5. Click **Add extension** when prompted

            ### Option 2: Load Unpacked (Source)
            1. Download `bookmarkly-${{ steps.version.outputs.VERSION }}-source.zip` below
            2. Unzip the file
            3. Open `chrome://extensions/`
            4. Enable **Developer mode** (top-right toggle)
            5. Click **Load unpacked** → select the `dist/` folder from the unzipped source

            ### Option 3: Build from Source
            ```bash
            git clone https://github.com/aayushmehta25466/Bookmarkly.git
            cd Bookmarkly
            git checkout v${{ steps.version.outputs.VERSION }}
            npm install
            npm run build
            ```
            Then load the `dist/` folder in `chrome://extensions/`.

            ---

            **Full Changelog**: https://github.com/aayushmehta25466/Bookmarkly/compare/${{ steps.version.outputs.VERSION }}...v${{ steps.version.outputs.VERSION }}
          files: |
            bookmarkly-${{ steps.version.outputs.VERSION }}.crx
            bookmarkly-${{ steps.version.outputs.VERSION }}-source.zip
          draft: false
          prerelease: false
