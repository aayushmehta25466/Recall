name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # 1. Checkout repository
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Setup Node.js
      # ---------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # ---------------------------------------------------------
      # 3. Install dependencies
      # ---------------------------------------------------------
      - name: Install dependencies
        run: npm ci

      # ---------------------------------------------------------
      # 4. Build extension
      # ---------------------------------------------------------
      - name: Build extension
        run: npm run build

      # ---------------------------------------------------------
      # 5. Get version from Git tag
      # ---------------------------------------------------------
      - name: Get version from tag
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"

          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

          echo "Building Bookmarkly version: $VERSION"

      # ---------------------------------------------------------
      # 6. Sync manifest version with Git tag
      # ---------------------------------------------------------
      - name: Sync manifest version
        run: |
          node <<'NODE'
          const fs = require('fs');

          const manifestPath = 'dist/manifest.json';
          const version = process.env.VERSION;

          const manifest = JSON.parse(
            fs.readFileSync(manifestPath, 'utf8')
          );

          manifest.version = version;

          fs.writeFileSync(
            manifestPath,
            JSON.stringify(manifest, null, 2) + '\n'
          );

          console.log(`Manifest version updated to ${version}`);
          NODE
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}

      # ---------------------------------------------------------
      # 7. Verify manifest
      # ---------------------------------------------------------
      - name: Verify manifest
        run: |
          echo "Final manifest:"
          cat dist/manifest.json

      # ---------------------------------------------------------
      # 8. Create source code ZIP
      # ---------------------------------------------------------
      - name: Create source code zip
        run: |
          zip -r \
            "bookmarkly-${{ steps.version.outputs.VERSION }}-source.zip" \
            . \
            -x "node_modules/*" \
               "dist/*" \
               ".git/*" \
               "extension-key.pem" \
               "key.pem" \
               "*.crx"

      # ---------------------------------------------------------
      # 9. Check CRX signing secret
      # ---------------------------------------------------------
      - name: Check CRX signing secret
        env:
          CRX_PRIVATE_KEY_B64: ${{ secrets.CRX_PRIVATE_KEY_B64 }}
        run: |
          if [ -z "$CRX_PRIVATE_KEY_B64" ]; then
            echo "::error::CRX_PRIVATE_KEY_B64 is NOT available to this workflow."
            echo "Make sure CRX_PRIVATE_KEY_B64 exists under:"
            echo "Settings -> Secrets and variables -> Actions -> Repository secrets"
            exit 1
          fi

          echo "CRX_PRIVATE_KEY_B64 is available."
          echo "Encoded key length: ${#CRX_PRIVATE_KEY_B64}"

      # ---------------------------------------------------------
      # 10. Restore permanent CRX private key
      # ---------------------------------------------------------
      - name: Restore CRX private key
        env:
          CRX_PRIVATE_KEY_B64: ${{ secrets.CRX_PRIVATE_KEY_B64 }}
        run: |
          printf '%s' "$CRX_PRIVATE_KEY_B64" \
            | base64 --decode \
            > extension-key.pem

          chmod 600 extension-key.pem

          if [ ! -s extension-key.pem ]; then
            echo "::error::Decoded private key is empty."
            rm -f extension-key.pem
            exit 1
          fi

          echo "CRX private key restored successfully."

      # ---------------------------------------------------------
      # 11. Verify CRX3 package tool
      # ---------------------------------------------------------
      - name: Verify CRX3 package tool
        run: |
          npx crx3 --help

      # ---------------------------------------------------------
      # 12. Create signed CRX
      # ---------------------------------------------------------
      - name: Create CRX package
        run: |
          npx crx3 dist/ \
            --key extension-key.pem \
            --crx "bookmarkly-${{ steps.version.outputs.VERSION }}.crx"

      # ---------------------------------------------------------
      # 13. Verify CRX package
      # ---------------------------------------------------------
      - name: Verify CRX package
        run: |
          CRX_FILE="bookmarkly-${{ steps.version.outputs.VERSION }}.crx"

          if [ ! -f "$CRX_FILE" ]; then
            echo "::error::CRX file was not created."
            exit 1
          fi

          if [ ! -s "$CRX_FILE" ]; then
            echo "::error::CRX file is empty."
            exit 1
          fi

          echo "CRX created successfully:"
          ls -lh "$CRX_FILE"

      # ---------------------------------------------------------
      # 14. Remove private key from runner
      # ---------------------------------------------------------
      - name: Remove signing key
        if: always()
        run: |
          rm -f extension-key.pem
          echo "Signing key removed from runner."

      # ---------------------------------------------------------
      # 15. Generate changelog
      # ---------------------------------------------------------
      - name: Get changelog from commits
        id: changelog
        shell: bash
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s" HEAD)
          else
            COMMITS=$(git log --pretty=format:"- %s" "${PREV_TAG}..HEAD")
          fi

          echo "COMMITS<<EOF" >> "$GITHUB_OUTPUT"
          echo "$COMMITS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------
      # 16. Create GitHub Release
      # ---------------------------------------------------------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "🚀 Bookmarkly v${{ steps.version.outputs.VERSION }}"
          tag_name: "v${{ steps.version.outputs.VERSION }}"

          body: |
            ## What's New

            ${{ steps.changelog.outputs.COMMITS }}

            ---

            ## Downloads

            ### 📦 Chrome Extension

            Download:

            `bookmarkly-${{ steps.version.outputs.VERSION }}.crx`

            ### 📁 Source Code

            Download:

            `bookmarkly-${{ steps.version.outputs.VERSION }}-source.zip`

            ---

            ## Installation

            ### Option 1: CRX

            1. Download the `.crx` file.
            2. Open `chrome://extensions/`
            3. Enable **Developer mode**.
            4. Drag the `.crx` file onto the Extensions page.
            5. Follow Chrome's installation prompt.

            ### Option 2: Load Unpacked

            1. Download the source ZIP.
            2. Extract the ZIP.
            3. Open `chrome://extensions/`
            4. Enable **Developer mode**.
            5. Click **Load unpacked**.
            6. Select the `dist` folder.

            ### Option 3: Build From Source

            ```bash
            git clone https://github.com/aayushmehta25466/Bookmarkly.git
            cd Bookmarkly
            git checkout v${{ steps.version.outputs.VERSION }}
            npm install
            npm run build
            ```

            Then load the `dist/` folder from:

            `chrome://extensions/`

            ---

            **Version:** `${{ steps.version.outputs.VERSION }}`

          files: |
            bookmarkly-${{ steps.version.outputs.VERSION }}.crx
            bookmarkly-${{ steps.version.outputs.VERSION }}-source.zip

          draft: false
          prerelease: false
