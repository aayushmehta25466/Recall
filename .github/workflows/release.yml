name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # 1. Checkout repository
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history so the changelog can diff against the previous tag
          fetch-depth: 0

      # ---------------------------------------------------------
      # 2. Setup Node.js (Extension.js requires >= 22.12)
      # ---------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ---------------------------------------------------------
      # 3. Install dependencies
      # ---------------------------------------------------------
      - name: Install dependencies
        run: npm ci

      # ---------------------------------------------------------
      # 4. Tests must pass before anything is published
      # ---------------------------------------------------------
      - name: Run tests
        run: npm test

      # ---------------------------------------------------------
      # 5. Get version from Git tag
      # ---------------------------------------------------------
      - name: Get version from tag
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"

          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

          echo "Building Recall version: $VERSION"

      # ---------------------------------------------------------
      # 6. Build every browser target
      #
      # Each script writes `dist/<target>`; the same scripts are used
      # locally, so CI output cannot drift from a hand-built one.
      # ---------------------------------------------------------
      - name: Build all browser targets
        run: |
          npm run build:chrome
          npm run build:firefox
          npm run build:opera

      # ---------------------------------------------------------
      # 7. Sync the tag version into EVERY target's manifest
      #
      # Chrome is not special: the Firefox manifest is what AMO reads,
      # and the Opera one is what its store reads.
      # ---------------------------------------------------------
      - name: Sync manifest version into every target
        run: |
          node <<'NODE'
          const fs = require('fs');

          const version = process.env.VERSION;
          const targets = ['chrome', 'firefox', 'opera'];

          for (const target of targets) {
            const manifestPath = `dist/${target}/manifest.json`;

            if (!fs.existsSync(manifestPath)) {
              console.error(`Manifest not found: ${manifestPath}`);
              process.exit(1);
            }

            const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
            manifest.version = version;
            fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + '\n');

            console.log(`${manifestPath} → ${version}`);
          }
          NODE
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}

      # ---------------------------------------------------------
      # 8. Verify each build resolved its own engine shape
      # ---------------------------------------------------------
      - name: Verify browser builds
        run: |
          for target in chrome firefox opera; do
            MANIFEST="dist/$target/manifest.json"

            if [ ! -f "$MANIFEST" ]; then
              echo "::error::$MANIFEST does not exist."
              exit 1
            fi

            node -e "
              const m = require('./$MANIFEST');
              const bg = m.background?.service_worker ? 'service_worker' : 'scripts';
              const panel = m.side_panel ? 'side_panel' : (m.sidebar_action ? 'sidebar_action' : 'none');
              console.log('$target'.padEnd(8), m.version, '| bg=' + bg, '| panel=' + panel);
            "
          done

      # ---------------------------------------------------------
      # 9. Create one ZIP per browser
      #
      # IMPORTANT: the build can emit its own zip inside dist/<target>.
      # It is removed first, otherwise the published archive would contain
      # a nested zip — which store review rejects.
      # ---------------------------------------------------------
      - name: Create per-browser ZIPs
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"

          for target in chrome firefox opera; do
            rm -f dist/$target/*.zip
            (cd dist/$target && zip -r "../../recall-${VERSION}-${target}.zip" .)
            echo "packaged recall-${VERSION}-${target}.zip"
          done

      # ---------------------------------------------------------
      # 10. Create source ZIP
      # ---------------------------------------------------------
      - name: Create source ZIP
        run: |
          zip -r \
            "recall-${{ steps.version.outputs.VERSION }}-source.zip" \
            . \
            -x "node_modules/*" \
               "dist/*" \
               ".git/*" \
               "*.crx" \
               "*.zip" \
               "*.pem" \
               "*.b64" \
               "release-body.md"

      # ---------------------------------------------------------
      # 11. Verify release artifacts
      # ---------------------------------------------------------
      - name: Verify release artifacts
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"

          for target in chrome firefox opera; do
            ZIP="recall-${VERSION}-${target}.zip"
            if [ ! -s "$ZIP" ]; then
              echo "::error::$ZIP was not created."
              exit 1
            fi
          done

          SOURCE_ZIP="recall-${VERSION}-source.zip"
          if [ ! -s "$SOURCE_ZIP" ]; then
            echo "::error::$SOURCE_ZIP was not created."
            exit 1
          fi

          echo "Release artifacts:"
          ls -lh recall-*.zip

      # ---------------------------------------------------------
      # 12. Assemble the release body
      #
      # Curated notes live in RELEASE_NOTES.md (reviewable in a PR);
      # the version and compare link are appended here.
      # ---------------------------------------------------------
      - name: Assemble release body
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          {
            cat RELEASE_NOTES.md
            echo ""
            echo "---"
            echo ""
            echo "**Version:** \`${VERSION}\`"
            if [ -n "$PREV_TAG" ]; then
              echo ""
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...v${VERSION}"
            fi
          } > release-body.md

      # ---------------------------------------------------------
      # 13. Create GitHub Release
      # ---------------------------------------------------------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "🚀 Recall v${{ steps.version.outputs.VERSION }}"
          tag_name: "v${{ steps.version.outputs.VERSION }}"
          body_path: release-body.md

          files: |
            recall-${{ steps.version.outputs.VERSION }}-chrome.zip
            recall-${{ steps.version.outputs.VERSION }}-firefox.zip
            recall-${{ steps.version.outputs.VERSION }}-opera.zip
            recall-${{ steps.version.outputs.VERSION }}-source.zip

          draft: false
          prerelease: false
