<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookmark Search Engine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./popup.css">
</head>
<body class="w-[520px] h-[620px] p-space-5 m-0 overflow-hidden flex flex-col bg-surface-base text-text-base font-primary">
  <header class="flex items-center justify-between mb-space-3">
    <div>
      <h1 class="text-md font-extrabold tracking-tight text-text-base flex items-center gap-2">
        <span class="inline-block w-2 h-2 rounded-full bg-accent-green"></span>
        Bookmark Engine
      </h1>
      <p class="text-xs text-text-secondary mt-space-1 ml-4">Semantic search &amp; organizer</p>
    </div>
    <div class="flex items-center gap-space-1">
      <button id="homeBtn" title="Open Home" class="p-space-3 rounded-sm text-text-secondary hover:text-text-base border-2 border-border-default hover:bg-surface-raised hover:border-accent-green transition-all duration-fast cursor-pointer shadow-clay-btn hover:shadow-clay-btn-hover hover:-translate-y-[1px] active:translate-y-[1px] active:shadow-clay-pressed">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0a1 1 0 01-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 01-1 1h-2z"/></svg>
      </button>
      <button id="organizeBtn" title="Organize All" class="p-space-3 rounded-sm text-text-secondary hover:text-text-base border-2 border-border-default hover:bg-surface-raised hover:border-accent-green transition-all duration-fast cursor-pointer shadow-clay-btn hover:shadow-clay-btn-hover hover:-translate-y-[1px] active:translate-y-[1px] active:shadow-clay-pressed">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
      </button>
      <button id="settingsBtn" title="Open Settings" class="p-space-3 rounded-sm text-text-secondary hover:text-text-base border-2 border-border-default hover:bg-surface-raised hover:border-accent-green transition-all duration-fast cursor-pointer shadow-clay-btn hover:shadow-clay-btn-hover hover:-translate-y-[1px] active:translate-y-[1px] active:shadow-clay-pressed">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
      </button>
    </div>
  </header>

  <main class="flex-1 flex flex-col gap-space-3 min-h-0">
    <input
      type="text"
      id="searchInput"
      placeholder="Search bookmarks..."
      class="w-full bg-surface-inset border-2 border-border-default rounded-sm text-base text-text-base px-space-4 py-space-3 placeholder-text-secondary shadow-clay-inset focus-visible:outline-[3px] focus-visible:outline-solid focus-visible:outline-accent-blue focus-visible:outline-offset-2 min-h-[48px]"
      autocomplete="off"
    >

    <div id="actionBar" class="hidden items-center gap-space-2 p-space-3 bg-surface-card rounded-sm border-2 border-border-default shadow-clay text-text-base"></div>

    <div id="resultsContainer" class="flex-1 overflow-y-auto pr-space-2 flex flex-col gap-space-3 [&::-webkit-scrollbar]:w-2 [&::-webkit-scrollbar-track]:bg-transparent [&::-webkit-scrollbar-thumb]:bg-border-muted [&::-webkit-scrollbar-thumb]:rounded-xs">
      <div class="flex items-center justify-center h-full text-text-secondary text-sm">
        Start typing to search your knowledge base...
      </div>
    </div>
  </main>

  <script type="module" src="./popup.js"></script>
</body>
</html>
